plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.24'
}

group = 'com.poopycobblemon'
version = file('VERSION').text.trim()

base {
    archivesName = 'cobblemon-ext'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    from('LICENSE', 'LICENSE-ASSETS.md')
    from('LICENSES') { into 'LICENSES' }
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

neoForge {
    version = "21.1.240"
    mods {
        cobblemon_ext {
            sourceSet(sourceSets.main)
        }
    }
}

// Maven resolves the exact Cobblemon artifact used for compilation and bridge tests.
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    cobblemonArtifact { canBeConsumed = false; transitive = false }
    compileOnly.extendsFrom cobblemonArtifact
}

dependencies {
    cobblemonArtifact "maven.modrinth:cobblemon:${cobblemon_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
}

// Exercise the bridge against the exact simulator shipped with pinned Cobblemon.
tasks.register('bridgeRegression', Exec) {
    workingDir projectDir
    commandLine 'node', 'showdowntest/bridge_regression_test.js'
}
def prepareShowdown = tasks.register('prepareShowdown', Exec) {
    inputs.files configurations.cobblemonArtifact
    inputs.files 'scripts/extract_showdown.py', 'scripts/build_support.py'
    outputs.dir layout.buildDirectory.dir('showdown')
    workingDir projectDir
    doFirst {
        commandLine 'python', 'scripts/extract_showdown.py',
                configurations.cobblemonArtifact.singleFile.absolutePath,
                layout.buildDirectory.dir('showdown').get().asFile.absolutePath
    }
}

tasks.register('showdownRegression', Exec) {
    dependsOn prepareShowdown
    workingDir projectDir
    commandLine 'node', 'showdowntest/headless_test.js', layout.buildDirectory.dir('showdown').get().asFile.absolutePath,
            'src/main/resources/assets/cobblemon_ext/showdown/cobblemon_ext_patch.js'
}
tasks.named('check') { dependsOn 'bridgeRegression', 'showdownRegression' }

// Run packaging failure-path checks from both Gradle and the release entry point.
tasks.register('releaseRegression', Exec) {
    workingDir projectDir
    commandLine 'python', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_*.py'
}
tasks.named('check') { dependsOn 'releaseRegression' }

tasks.named('bridgeRegression') { dependsOn prepareShowdown }

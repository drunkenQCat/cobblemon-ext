plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.24'
}

group = 'com.poopycobblemon'
version = file('VERSION').text.trim()

base {
    archivesName = 'cobblemon-ext'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    from('LICENSE', 'LICENSE-ASSETS.md')
    from('LICENSES') { into 'LICENSES' }
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

neoForge {
    version = "21.1.240"
    mods {
        cobblemon_ext {
            sourceSet(sourceSets.main)
        }
    }
}

// Maven resolves the exact Cobblemon artifact used for compilation and bridge tests.
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    cobblemonArtifact { canBeConsumed = false; transitive = false }
    compileOnly.extendsFrom cobblemonArtifact
}

dependencies {
    cobblemonArtifact "maven.modrinth:cobblemon:${cobblemon_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"

    // 无头单测：SpeciesBuilder / ExtHandlers 均为纯 Java，不需要 Minecraft 类路径
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-console-standalone:1.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.13'
}

// 不用 Gradle 自带 test 任务：其 worker 通过 @argfile 传递 classpath，Gradle 固定按
// UTF-8 写、而 Windows JDK 启动器按系统代码页读，项目路径含非 ASCII（本仓库的
// 实例目录）时会变成乱码路径 → ClassNotFoundException。JavaExec 直接把 classpath
// 作为进程参数传给 JUnit ConsoleLauncher，绕开该编码坑；CI 上两种方式等价。
tasks.named('test') { enabled = false }

tasks.register('unitTests', JavaExec) {
    dependsOn testClasses
    group = 'verification'
    description = 'Headless unit tests (JUnit ConsoleLauncher), safe on non-ASCII paths.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    args '--disable-banner'
    args '--details=summary'
    args '--class-path', sourceSets.test.runtimeClasspath.asPath
    args '--scan-class-path', layout.buildDirectory.dir('classes/java/test').get().asFile.absolutePath
    args '--reports-dir', layout.buildDirectory.dir('test-results/unit').get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'unitTests' }

// Exercise the bridge against the exact simulator shipped with pinned Cobblemon.
tasks.register('bridgeRegression', Exec) {
    workingDir projectDir
    commandLine 'node', 'showdowntest/bridge_regression_test.js'
}
def prepareShowdown = tasks.register('prepareShowdown', Exec) {
    inputs.files configurations.cobblemonArtifact
    inputs.files 'scripts/extract_showdown.py', 'scripts/build_support.py'
    outputs.dir layout.buildDirectory.dir('showdown')
    workingDir projectDir
    doFirst {
        commandLine 'python', 'scripts/extract_showdown.py',
                configurations.cobblemonArtifact.singleFile.absolutePath,
                layout.buildDirectory.dir('showdown').get().asFile.absolutePath
    }
}

tasks.register('showdownRegression', Exec) {
    dependsOn prepareShowdown
    workingDir projectDir
    commandLine 'node', 'showdowntest/headless_test.js', layout.buildDirectory.dir('showdown').get().asFile.absolutePath,
            'src/main/resources/assets/cobblemon_ext/showdown/cobblemon_ext_patch.js'
}
tasks.named('check') { dependsOn 'bridgeRegression', 'showdownRegression' }

// Run packaging failure-path checks from both Gradle and the release entry point.
tasks.register('releaseRegression', Exec) {
    workingDir projectDir
    commandLine 'python', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_*.py'
}
tasks.named('check') { dependsOn 'releaseRegression' }

tasks.named('bridgeRegression') { dependsOn prepareShowdown }
